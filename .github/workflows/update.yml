name: DART Financial Agent
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'dashboard/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dart-financial-agent
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect DART data and build report
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/run_pipeline.py
      - name: Commit generated data and report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data dashboard/data.json reports/financial_analysis.md
          if git diff --cached --quiet; then echo 'No data changes'; else git commit -m 'chore: update DART data and report'; fi
          git push origin main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
      - uses: actions/deploy-pages@v4
